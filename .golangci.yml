version: "2"

linters:
  default: standard
  settings:
    errcheck:
      # Printing to the terminal or a log: a failed write there can't be acted on.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
  exclusions:
    # Unchecked Close on read-only files and response bodies, and the like:
    # the same defaults golangci-lint v1 applied.
    presets:
      - std-error-handling
  enable:
    - errorlint
    - gocritic
    - misspell
    - revive
    - unparam
    - usestdlibvars

formatters:
  enable:
    - gofmt
    - goimports

issues:
  # Show every finding, not just the first 3 of a kind.
  max-issues-per-linter: 0
  max-same-issues: 0
