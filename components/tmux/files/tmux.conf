# ~/.tmux.conf — devbox. Start/attach with:  t   (alias for: tmux new -A -s main)
# Managed by devbox (ds update). Personal tweaks go in ~/.tmux.conf.local.

# Colours, keys and clipboard that work well from Windows Terminal / Cursor
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm*:RGB:extkeys"
set -s extended-keys on            # Shift+Enter etc. reach Claude Code
set -g set-clipboard on            # copying in tmux lands in the Windows clipboard (OSC 52)
set -g focus-events on
set -sg escape-time 10

# Bells (Claude Code done or waiting) from any window reach the laptop's
# terminal: Windows Terminal flashes the taskbar and marks the tab with a bell.
# The window that rang is highlighted in the status bar until you visit it.
set -g bell-action any
setw -g monitor-bell on
set -g visual-bell off

# Comfort
set -g mouse on                    # click panes, drag borders, scroll with the wheel
set -g history-limit 100000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Splits and new windows open in the current folder.  Prefix is Ctrl-b.
bind |  split-window -h -c "#{pane_current_path}"
bind -  split-window -v -c "#{pane_current_path}"
bind c  new-window      -c "#{pane_current_path}"
bind r  source-file ~/.tmux.conf \; display "tmux config reloaded"

# Quiet status bar on top
set -g status-position top
set -g status-style "bg=default,fg=colour245"
set -g status-left-length 30
set -g status-left "#[bold,fg=colour141] #S #[default]"
set -g status-right "#[fg=colour245]%a %H:%M "
setw -g window-status-format " #I:#W "
setw -g window-status-current-format "#[bold,fg=colour81] #I:#W "

# Personal tweaks (never touched by ds update)
source-file -q ~/.tmux.conf.local
