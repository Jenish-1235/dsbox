# The same checks as `just check` (shell list in scripts/lint-shell.sh).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  golangci-lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

  shellcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: scripts/lint-shell.sh

  gitleaks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # scan the whole history, not just the last commit
      - name: gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --redact --no-banner --log-opts=HEAD .

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l $(git ls-files '*.go'))
          [ -z "$unformatted" ] || { echo "$unformatted"; echo "not formatted: run just fmt"; exit 1; }
      - run: go vet ./...
      # jq: the Claude hooks script tests need it (they skip without it).
      - run: go test -race ./...

  infra:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: opentofu/setup-opentofu@v2
      - run: tofu fmt -check -recursive infra
      - run: cd infra && tofu init -backend=false -input=false && tofu validate
